<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NID PDF Extraction System</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8f9fa; margin: 0; padding: 30px 15px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #212529; font-size: 20px; margin-top: 0; margin-bottom: 25px; font-weight: 600; }
        .file-input-wrapper { border: 1px solid #ced4da; border-radius: 4px; padding: 6px 12px; background: #fff; margin-bottom: 15px; }
        input[type="file"] { width: 100%; font-size: 14px; }
        .btn-submit { width: 100%; background: #0056b3; color: #ffffff; border: none; padding: 12px; font-size: 15px; border-radius: 4px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
        .btn-submit:hover { background: #004085; }
        .section-title { font-weight: 700; margin-top: 25px; margin-bottom: 15px; color: #000; font-size: 15px; }
        .image-preview { display: flex; justify-content: space-around; align-items: flex-start; margin-bottom: 25px; text-align: center; }
        .img-box p { margin: 0 0 10px 0; font-size: 13px; font-weight: 600; color: #333; }
        .img-box img { max-width: 190px; height: auto; border: 1px solid #dee2e6; border-radius: 2px; }
        .sign-placeholder { border: 1px solid #ced4da; padding: 2px 8px; font-size: 12px; color: #495057; display: inline-block; background: #fff; }
        .json-box { background: #181818; color: #4ec9b0; padding: 18px; border-radius: 6px; overflow-x: auto; font-family: "Courier New", Courier, monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>NID PDF Extraction System</h2>
    
    <form id="uploadForm">
        <div class="file-input-wrapper">
            <input type="file" id="nidPdf" name="nid_pdf" accept=".pdf" required>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">ডাটা এক্সট্রাক্ট করুন</button>
    </form>

    <div id="resultSection" class="hidden">
        <div class="section-title">এক্সট্রাক্ট করা ছবি:</div>
        <div class="image-preview">
            <div class="img-box">
                <p>User Photo</p>
                <img id="userImg" src="" alt="User Photo">
            </div>
            <div class="img-box">
                <p>Signature</p>
                <div id="signContainer">
                    <img id="signImg" src="" alt="Signature" class="hidden">
                    <div id="signPlaceholder" class="sign-placeholder">Signature</div>
                </div>
            </div>
        </div>

        <div class="section-title">এক্সট্রাক্ট করা ডাটা (JSON):</div>
        <div class="json-box" id="jsonDisplay"></div>
    </div>
</div>

<script>
document.getElementById('uploadForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const fileInput = document.getElementById('nidPdf');
    
    if (!fileInput.files[0]) return;

    btn.innerText = "প্রসেস করা হচ্ছে...";
    btn.disabled = true;

    const formData = new FormData();
    formData.append('nid_pdf', fileInput.files[0]);

    try {
        const response = await fetch('/api/extract', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();
        
        if (!response.ok || !data.success) {
            throw new Error(data.error || data.message || 'ডাটা এক্সট্রাক্ট করতে সমস্যা হয়েছে!');
        }

        document.getElementById('resultSection').classList.remove('hidden');
        document.getElementById('jsonDisplay').innerText = JSON.stringify(data, null, 2);

        if (data.data && data.data.userIMG) {
            document.getElementById('userImg').src = data.data.userIMG;
        }

        if (data.data && data.data.signIMG) {
            document.getElementById('signImg').src = data.data.signIMG;
            document.getElementById('signImg').classList.remove('hidden');
            document.getElementById('signPlaceholder').classList.add('hidden');
        } else {
            document.getElementById('signImg').classList.add('hidden');
            document.getElementById('signPlaceholder').classList.remove('hidden');
        }
    } catch (err) {
        alert("এরর: " + err.message);
    } finally {
        btn.innerText = "ডাটা এক্সট্রাক্ট করুন";
        btn.disabled = false;
    }
});
</script>

</body>
</html>
